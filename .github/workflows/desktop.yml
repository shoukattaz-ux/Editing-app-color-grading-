name: Desktop app
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fd2c60d-4i1i2q, main]          # every code change on these branches builds and publishes an update
    paths-ignore: ["docs/**", "**.md"]
concurrency:
  group: desktop-build
  cancel-in-progress: true                          # a newer push replaces a build that is still running
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller
      - name: FFmpeg
        run: python scripts/fetch_ffmpeg.py
      - name: Backend tests (informational on Windows; the Linux suite gates the code)
        continue-on-error: true
        env:
          EVP_FFMPEG: ${{ github.workspace }}\build\ffmpeg\ffmpeg.exe
          EVP_FFPROBE: ${{ github.workspace }}\build\ffmpeg\ffprobe.exe
        run: python -m pytest -q backend/tests
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build
      - name: Freeze the engine
        run: python scripts/build_engine.py
      - name: Installer
        working-directory: electron
        run: |
          npm ci
          npm pkg set version=0.1.${{ github.run_number }}
          npx electron-builder --win --publish never
      - name: Self-test the frozen engine (non-ASCII video tags, one-click project, key + look preview)
        run: python scripts/selftest_engine.py
      - name: Smoke test the unpacked app (starts it, loads the UI, checks the engine)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:EVP_SMOKE = "1"
          $env:EVP_SMOKE_OUT = "$PWD\smoke.txt"
          $p = Start-Process -FilePath "$PWD\release\win-unpacked\EVP Editor.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the packaged app did not finish its start-up check in 120 s" }
          if (-not (Test-Path smoke.txt)) { throw "the packaged app did not report" }
          Get-Content smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EVP-Editor-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-${{ github.run_number }}
          name: EVP Editor installer (build ${{ github.run_number }})
          prerelease: true
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          body: |
            Windows installer built from commit ${{ github.sha }}.
            Download "EVP-Editor-Setup-<version>.exe" and run it (installed copies update themselves from here: Help > Check for updates). Windows SmartScreen may warn because the app is not code-signed: choose More info > Run anyway.
